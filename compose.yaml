services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Crea el archivo .env con DB_PASSWORD}
      TZ: America/Bogota
    volumes:
      - banking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/nexo
      DB_USER: nexo
      DB_PASSWORD: ${DB_PASSWORD}
      BIND_ADDRESS: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
  tests:
    image: maven:3.9.11-eclipse-temurin-21
    profiles: ["test"]
    working_dir: /workspace/backend
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    environment:
      TEST_DB_URL: jdbc:postgresql://test-db:5432/nexo_test
      DB_USER: nexo
      DB_PASSWORD: ${DB_PASSWORD}
    command: mvn -B verify
    depends_on:
      test-db:
        condition: service_healthy
  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: nexo_test
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo_test"]
      interval: 3s
      timeout: 5s
      retries: 20
volumes:
  banking-data:
  maven-cache:
