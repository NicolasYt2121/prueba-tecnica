name: verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nexo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/nexo_test
          DB_USER: nexo
          DB_PASSWORD: ci-only-password
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test frontend-tests/*.test.mjs
      - run: docker build -t nexo-finanzas:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-and-tests
          path: |
            backend/target/site/jacoco
            backend/target/surefire-reports
            backend/target/failsafe-reports
